services:
  caddy:
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config

  pcp-backend-a:
    ports:
      - "8081:8080"

  pcp-backend-b:
    ports:
      - "8082:8080"

  pcp-backend-c:
    ports:
      - "8083:8080"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
