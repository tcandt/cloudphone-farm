version: '3.8'

services:
  pcp-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_FEATURE_RENTAL_STORE=false

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: phone_control_platform
      POSTGRES_USER: pcp_user
      POSTGRES_PASSWORD: pcp_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    environment:
      - REALM=phonecontrol.io
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
