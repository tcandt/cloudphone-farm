name: Phone Control Platform CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Lint & Test (Frontend & Go Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcp
          POSTGRES_PASSWORD: pcp_password
          POSTGRES_DB: phone_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Execute ESLint Check (Zero Warnings)
        run: npm run lint

      - name: Execute TypeScript Typecheck
        run: npm run typecheck

      - name: Execute Vitest Integration Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        run: npm run e2e

      - name: Execute Vite Production Build
        run: npm run build

      - name: Setup Go Environment (Pinned 1.22.6)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.6'
          cache-dependency-path: backend/go.sum

      - name: Execute Go Backend Unit & Migration Tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable
          REDIS_URL: localhost:6379
        run: go test -v ./...

      - name: Build Go Backend Server Binary
        working-directory: backend
        run: go build -v -o /tmp/pcp-server ./cmd/server

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f compose.yaml config
          docker compose -f compose.production.yaml config

  android-build:
    name: Build Android Agent APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Verify Android Agent (lint, test, assemble)
        working-directory: android-agent
        run: gradle lintDebug testDebugUnitTest assembleDebug --no-daemon
