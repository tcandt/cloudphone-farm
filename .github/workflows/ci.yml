name: Phone Control Platform CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Lint & Test (Frontend & Go Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Execute ESLint Check (Zero Warnings)
        run: npm run lint

      - name: Execute TypeScript Typecheck
        run: npm run typecheck

      - name: Execute Vitest Integration Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        run: npm run e2e

      - name: Execute Vite Production Build
        run: npm run build

      - name: Setup Go Environment (Pinned 1.22.6)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.6'
          cache-dependency-path: backend/go.sum

      - name: Execute Go Backend Unit & Migration Tests
        working-directory: backend
        run: go test -v ./...

      - name: Build Go Backend Server Binary
        working-directory: backend
        run: go build -v -o /tmp/pcp-server ./cmd/server

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f compose.yaml config
          docker compose -f compose.production.yaml config

  android-build:
    name: Build Android Agent APK (Gradle assembleDebug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Agent APK
        working-directory: android-agent
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
