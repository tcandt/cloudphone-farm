name: Phone Control Platform CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Lint & Test (Frontend & Go Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcp
          POSTGRES_PASSWORD: pcp_password
          POSTGRES_DB: phone_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Execute ESLint Check (Zero Warnings)
        run: npm run lint

      - name: Execute TypeScript Typecheck
        run: npm run typecheck

      - name: Execute Vitest Integration Tests
        run: npm run test

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Evidence Collector Unit Tests
        run: python scripts/phase17-physical-gate/test_false_pass_prevention.py

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        run: npm run e2e

      - name: Execute Vite Production Build
        run: npm run build

      - name: Setup Go Environment (Pinned 1.26.5)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Execute Go Backend Unit & Migration Tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -race -v -p 1 ./... -count=1

      - name: Build Go Backend Server Binary
        working-directory: backend
        run: go build -v -o /tmp/pcp-server ./cmd/server

      - name: Build Backend Docker Image
        run: docker build -f infra/docker/Dockerfile.backend -t cloudphone-backend:ci .

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f compose.yaml config
          docker compose -f compose.production.yaml config
          docker compose -f compose.cluster.yml config

  cluster-integration:
    name: Cluster Integration & Multi-Node Failover Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcp
          POSTGRES_PASSWORD: pcp_password
          POSTGRES_DB: phone_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment (Pinned 1.26.5)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Execute 3-Node Cluster Integration Tests & Load Harness
        working-directory: backend
        env:
          DATABASE_URL: postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable
          POSTGRES_URL: postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable
          REDIS_URL: redis://localhost:6379
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: pcp
          DB_PASSWORD: pcp_password
          DB_NAME: phone_farm
          GOTOOLCHAIN: local
        run: |
          go test -race -v ./internal/cluster/... ./internal/repository/postgres/... ./internal/repository/redis/... ./internal/telemetry/... ./internal/transport/http/middleware/... ./internal/transport/ws/...
          
          # Integration tests mutate schema directly.
          # Reset DB before testing the production migration path.
          docker run --rm --network host \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16-alpine \
            psql \
              -h 127.0.0.1 \
              -p "$DB_PORT" \
              -U "$DB_USER" \
              -d "$DB_NAME" \
              -v ON_ERROR_STOP=1 \
              -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

          go build -o /tmp/migrate ./cmd/migrate
          go build -o /tmp/server ./cmd/server
          go build -o /tmp/e2esmoke ./cmd/e2esmoke
          go build -o /tmp/loadharness ./cmd/loadharness
          go build -o /tmp/phase16_release_gate ./cmd/phase16_release_gate

          # Apply production database migrations using migration tool with SHA256 checksum ledger
          POSTGRES_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" /tmp/migrate

          APP_ENV=test NODE_ID=node-a PORT=8081 POSTGRES_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" DATABASE_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" REDIS_URL="redis://localhost:6379" /tmp/server &
          PID_A=$!

          APP_ENV=test NODE_ID=node-b PORT=8082 POSTGRES_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" DATABASE_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" REDIS_URL="redis://localhost:6379" /tmp/server &
          PID_B=$!

          APP_ENV=test NODE_ID=node-c PORT=8083 POSTGRES_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" DATABASE_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" REDIS_URL="redis://localhost:6379" /tmp/server &
          PID_C=$!

          sleep 3

          curl -f http://localhost:8081/health/live
          curl -f http://localhost:8082/health/live
          curl -f http://localhost:8083/health/live

          /tmp/e2esmoke -node-a=http://localhost:8081 -node-b=http://localhost:8082 -node-c=http://localhost:8083 -pid-a=$PID_A

          # Restart Node A after failover test to restore 3-node cluster for release gate
          APP_ENV=test NODE_ID=node-a PORT=8081 POSTGRES_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" DATABASE_URL="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" REDIS_URL="redis://localhost:6379" /tmp/server &
          PID_A=$!
          sleep 2

          # Generate temporary runtime secrets for CI stack verification
          mkdir -p ../secrets ../infra/postgres/certs
          echo "postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" > ../secrets/postgres_url.txt
          echo "redis://localhost:6379" > ../secrets/redis_url.txt
          echo "pcp_password" > ../secrets/postgres_password.txt
          echo "pcp_password" > ../secrets/redis_password.txt
          echo "coturn_secret_2026" > ../secrets/coturn_secret.txt

          # Start Caddy Perimeter Reverse Proxy container with Caddyfile.local
          docker run -d --name caddy-perimeter --network host -v $(pwd)/../infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile caddy:2-alpine
          sleep 3
          docker logs caddy-perimeter || true

          /tmp/phase16_release_gate -nodes=http://localhost:8081,http://localhost:8082,http://localhost:8083 -caddy-url=http://127.0.0.1:8080 -postgres-url="postgres://pcp:pcp_password@localhost:5432/phone_farm?sslmode=disable" -redis-url="redis://localhost:6379"

          docker rm -f caddy-perimeter || true
          kill $PID_A $PID_B $PID_C

  android-build:
    name: Build Android Agent APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Android Main Source Unchanged Since Slice 2.1 Locked Baseline
        run: |
          git diff --exit-code 10b97e6e28fbcc0fd2168d19c4f613797b361056..HEAD -- android-agent/app/src/main/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Verify Android Agent (lint, test, assemble)
        working-directory: android-agent
        run: gradle lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Generate APK Metadata & Checksum
        working-directory: android-agent/app/build/outputs/apk/debug
        run: |
          APK_FILE="app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: $APK_FILE not found!" >&2
            exit 1
          fi
          
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$APK_SHA256  $APK_FILE" > "${APK_FILE}.sha256"
          
          BUILD_TIMESTAMP_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat <<EOF > build_metadata.json
          {
            "repository": "${{ github.repository }}",
            "baseline_tag": "v0.1.7-phase1.7-software-locked",
            "baseline_sha": "5b577483fc32a9b5a0115fccb0ab732dbeeb2796",
            "build_commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "application_id": "com.tcandt.cloudphone.agent",
            "variant": "debug",
            "version_code": 1,
            "version_name": "1.0.0",
            "build_timestamp_utc": "$BUILD_TIMESTAMP_UTC",
            "apk_filename": "$APK_FILE",
            "apk_sha256": "$APK_SHA256",
            "github_run_id": "${{ github.run_id }}",
            "github_run_attempt": "${{ github.run_attempt }}"
          }
          EOF
          
          echo "Generated build_metadata.json:"
          cat build_metadata.json

      - name: Upload Android Agent APK & Metadata
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-apk-${{ github.sha }}
          path: |
            android-agent/app/build/outputs/apk/debug/app-debug.apk
            android-agent/app/build/outputs/apk/debug/app-debug.apk.sha256
            android-agent/app/build/outputs/apk/debug/build_metadata.json
          if-no-files-found: error
          retention-days: 90
