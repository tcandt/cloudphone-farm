networks:
  pcp-internal:
    driver: bridge
    internal: true
  pcp-public:
    driver: bridge

services:
  caddy:
    image: caddy:2.7-alpine
    networks:
      - pcp-public
      - pcp-internal
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./infra/caddy/Caddyfile.production:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - pcp-web
      - pcp-backend-a
      - pcp-backend-b
      - pcp-backend-c

  pcp-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    networks:
      - pcp-internal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_FEATURE_RENTAL_STORE=false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  pcp-backend-a:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    networks:
      - pcp-internal
    environment:
      - APP_ENV=production
      - NODE_ID=node-a
      - PORT=8080
      - POSTGRES_URL=postgres://pcp_user:pcp_secure_password_2026@postgres:5432/phone_control_platform?sslmode=disable
      - REDIS_URL=redis://:pcp_redis_password_2026@redis:6379/0
      - COTURN_SHARED_SECRET_FILE=/run/secrets/coturn_secret
      - COTURN_HOST=${COTURN_HOST:-turn.phonecontrol.io}
    secrets:
      - postgres_password
      - redis_password
      - coturn_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  pcp-backend-b:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    networks:
      - pcp-internal
    environment:
      - APP_ENV=production
      - NODE_ID=node-b
      - PORT=8080
      - POSTGRES_URL=postgres://pcp_user:pcp_secure_password_2026@postgres:5432/phone_control_platform?sslmode=disable
      - REDIS_URL=redis://:pcp_redis_password_2026@redis:6379/0
      - COTURN_SHARED_SECRET_FILE=/run/secrets/coturn_secret
      - COTURN_HOST=${COTURN_HOST:-turn.phonecontrol.io}
    secrets:
      - postgres_password
      - redis_password
      - coturn_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  pcp-backend-c:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    networks:
      - pcp-internal
    environment:
      - APP_ENV=production
      - NODE_ID=node-c
      - PORT=8080
      - POSTGRES_URL=postgres://pcp_user:pcp_secure_password_2026@postgres:5432/phone_control_platform?sslmode=disable
      - REDIS_URL=redis://:pcp_redis_password_2026@redis:6379/0
      - COTURN_SHARED_SECRET_FILE=/run/secrets/coturn_secret
      - COTURN_HOST=${COTURN_HOST:-turn.phonecontrol.io}
    secrets:
      - postgres_password
      - redis_password
      - coturn_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    networks:
      - pcp-internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phone_control_platform}
      POSTGRES_USER: ${POSTGRES_USER:-pcp_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp_user -d phone_control_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    networks:
      - pcp-internal
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass $$(cat /run/secrets/redis_password)"]
    secrets:
      - redis_password
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$(cat /run/secrets/redis_password) ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.2-alpine
    networks:
      - pcp-public
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-65535:49152-65535/udp"
    environment:
      - COTURN_REALM=${COTURN_REALM:-phonecontrol.io}
    secrets:
      - coturn_secret
    command:
      - sh
      - -c
      - turnserver -n --log-file=stdout --use-auth-secret --static-auth-secret=$$(cat /run/secrets/coturn_secret) --realm=$${COTURN_REALM:-phonecontrol.io} --min-port=49152 --max-port=65535
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  coturn_secret:
    file: ./secrets/coturn_secret.txt

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
