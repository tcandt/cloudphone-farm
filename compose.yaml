services:
  pcp-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_FEATURE_RENTAL_STORE=false

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phone_control_platform}
      POSTGRES_USER: ${POSTGRES_USER:-pcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcp_dev_password_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password_only}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
