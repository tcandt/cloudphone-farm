openapi: 3.0.3
info:
  title: Phone Control Platform API Specification
  version: 1.1.0-hardening
  description: |
    Phone Control Platform authoritative REST & WebSocket API specification.
    Serves organization management, device registry, WebRTC stream orchestration, control leases, command dispatch, agent enrollment, and audit logging.

servers:
  - url: /api/v1
    description: Primary API Gateway Base Path

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /auth/session:
    get:
      summary: Retrieve current authenticated session
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: User session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/login:
    post:
      summary: User Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: User Logout & Session Revocation
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Session invalidated successfully (clears session cookie / revokes token)
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /devices:
    get:
      summary: List Tenant Devices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Collection of devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceEntity'
                  total:
                    type: integer

  /devices/{id}/control-leases:
    post:
      summary: Acquire Exclusive Control Lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Control lease granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLease'
        '409':
          $ref: '#/components/responses/ConflictError'

    delete:
      summary: Release Control Lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Lease released successfully

  /devices/{id}/control-leases/renew:
    post:
      summary: Renew Control Lease TTL
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lease renewed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLease'

  /devices/{id}/stream-sessions:
    post:
      summary: Request WebRTC Stream Session / Signaling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution:
                  type: string
                fps:
                  type: integer
      responses:
        '201':
          description: WebRTC Signaling session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_session_id:
                    type: string
                  sdp_offer:
                    type: string
                  ice_servers:
                    type: array
                    items:
                      type: object

  /commands:
    post:
      summary: Dispatch Device Command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchCommandRequest'
      responses:
        '200':
          description: Command acknowledged and dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCommand'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /enrollment-tokens:
    get:
      summary: List Active Enrollment Tokens
      responses:
        '200':
          description: List of enrollment tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentToken'

    post:
      summary: Generate One-Time Agent Enrollment Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bound_group_id:
                  type: string
      responses:
        '201':
          description: One-time token generated (10-min TTL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentToken'

  /enrollment-tokens/{id}:
    get:
      summary: Get Enrollment Token by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrollment token details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentToken'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Revoke Enrollment Token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Token revoked successfully

  /agents/enroll:
    post:
      summary: Enroll Android APK Agent via Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_code, public_key_fingerprint]
              properties:
                token_code:
                  type: string
                public_key_fingerprint:
                  type: string
                app_version:
                  type: string
      responses:
        '200':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  device_id:
                    type: string

  /audit-logs:
    get:
      summary: List Organization Audit Logs
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Audit logs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogItem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: pcp_session

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    UserSession:
      type: object
      required: [user_id, organization_id, email, display_name, role, permissions]
      properties:
        user_id:
          type: string
        organization_id:
          type: string
        organization_name:
          type: string
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    DeviceEntity:
      type: object
      required: [device_id, organization_id, display_name, model, android_version, serial_number, status]
      properties:
        device_id:
          type: string
        organization_id:
          type: string
        display_name:
          type: string
        model:
          type: string
        android_version:
          type: string
        serial_number:
          type: string
        status:
          type: string
          enum: [provisioning, online, offline, degraded, maintenance, revoked, retired]
        capabilities:
          type: object
        telemetry:
          type: object

    ControlLease:
      type: object
      required: [control_lease_id, device_id, organization_id, user_id, acquired_at, expires_at, ttl_seconds]
      properties:
        control_lease_id:
          type: string
        device_id:
          type: string
        organization_id:
          type: string
        user_id:
          type: string
        user_display_name:
          type: string
        acquired_at:
          type: string
        expires_at:
          type: string
        ttl_seconds:
          type: integer

    DispatchCommandRequest:
      type: object
      required: [deviceId, type, payload, idempotencyKey, issuedAt, expiresAt]
      properties:
        deviceId:
          type: string
        type:
          type: string
          enum:
            - gesture.touch
            - gesture.swipe
            - input.text
            - global.back
            - global.home
            - global.recents
            - screen.capture
            - device.reboot
            - device.lock
            - screen.rotate
            - apk.install
            - network.proxy.apply
        payload:
          type: object
        controlLeaseId:
          type: string
        idempotencyKey:
          type: string
        issuedAt:
          type: string
        expiresAt:
          type: string

    DeviceCommand:
      type: object
      required: [command_id, device_id, organization_id, actor_id, actor_name, command_type, status, created_at]
      properties:
        command_id:
          type: string
        device_id:
          type: string
        organization_id:
          type: string
        actor_id:
          type: string
        actor_name:
          type: string
        command_type:
          type: string
        status:
          type: string
          enum: [pending, ack, executing, succeeded, failed]
        created_at:
          type: string

    EnrollmentToken:
      type: object
      required: [token_id, organization_id, token_code, created_by, expires_at, used]
      properties:
        token_id:
          type: string
        organization_id:
          type: string
        token_code:
          type: string
        created_by:
          type: string
        expires_at:
          type: string
        used:
          type: boolean
        bound_group_id:
          type: string

    AuditLogItem:
      type: object
      required: [audit_id, organization_id, action_code, actor_id, resource_type, resource_id, created_at]
      properties:
        audit_id:
          type: string
        organization_id:
          type: string
        action_code:
          type: string
        actor_id:
          type: string
        actor_email:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        details:
          type: string
        ip_address:
          type: string
        created_at:
          type: string

  responses:
    BadRequestError:
      description: Bad request envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Resource conflict or control lease occupied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
