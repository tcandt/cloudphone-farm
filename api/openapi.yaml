openapi: 3.0.3
info:
  title: Phone Control Platform API Specification
  version: 1.1.0-prototype
  description: |
    Phone Control Platform authoritative REST & WebSocket API specification.
    Serves organization management, device registry, WebRTC stream orchestration, control leases, command dispatch, and audit logging.

servers:
  - url: /api/v1
    description: Primary API Gateway Base Path

paths:
  /auth/session:
    get:
      summary: Retrieve current authenticated session
      responses:
        '200':
          description: User session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /devices:
    get:
      summary: List Tenant Devices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Collection of devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceEntity'
                  total:
                    type: integer

  /devices/{id}/control-leases:
    post:
      summary: Acquire Exclusive Control Lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Control lease granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLease'
        '409':
          $ref: '#/components/responses/ConflictError'

    delete:
      summary: Release Control Lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Lease released successfully

  /commands:
    post:
      summary: Dispatch Device Command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchCommandRequest'
      responses:
        '200':
          description: Command acknowledged and dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCommand'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /enrollment-tokens:
    post:
      summary: Generate One-Time Agent Enrollment Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bound_group_id:
                  type: string
      responses:
        '201':
          description: One-time token generated (10-min TTL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentToken'

components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    UserSession:
      type: object
      required: [user_id, organization_id, email, display_name, roles, permissions]
      properties:
        user_id:
          type: string
        organization_id:
          type: string
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    DeviceEntity:
      type: object
      required: [device_id, organization_id, name, model, serial_number, status]
      properties:
        device_id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        model:
          type: string
        serial_number:
          type: string
        status:
          type: string
          enum: [online, offline, busy, maintenance]

    ControlLease:
      type: object
      required: [control_lease_id, device_id, organization_id, user_id, acquired_at, expires_at, ttl_seconds]
      properties:
        control_lease_id:
          type: string
        device_id:
          type: string
        organization_id:
          type: string
        user_id:
          type: string
        acquired_at:
          type: string
        expires_at:
          type: string
        ttl_seconds:
          type: integer

    DispatchCommandRequest:
      type: object
      required: [deviceId, type, payload, idempotencyKey, issuedAt, expiresAt]
      properties:
        deviceId:
          type: string
        type:
          type: string
        payload:
          type: object
        controlLeaseId:
          type: string
        idempotencyKey:
          type: string
        issuedAt:
          type: string
        expiresAt:
          type: string

    DeviceCommand:
      type: object
      required: [command_id, device_id, organization_id, actor_id, command_type, status, created_at]
      properties:
        command_id:
          type: string
        device_id:
          type: string
        organization_id:
          type: string
        actor_id:
          type: string
        command_type:
          type: string
        status:
          type: string
          enum: [pending, ack, executing, succeeded, failed]
        created_at:
          type: string

    EnrollmentToken:
      type: object
      required: [token_id, organization_id, token_code, created_by, expires_at, used]
      properties:
        token_id:
          type: string
        organization_id:
          type: string
        token_code:
          type: string
        created_by:
          type: string
        expires_at:
          type: string
        used:
          type: boolean

  responses:
    BadRequestError:
      description: Bad request envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Resource conflict or control lease occupied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
